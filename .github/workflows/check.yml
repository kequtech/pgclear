name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgclear_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgclear_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGCLEAR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pgclear_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  compatibility:
    name: TLS / Unix / PgBouncer / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common build-essential pkg-config libevent-dev libssl-dev
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${{ matrix.postgres }}
      - name: Build checksum-pinned PgBouncer
        id: pgbouncer
        run: |
          pgclear_proxy_binary=$(node scripts/build-pgbouncer.mjs "$RUNNER_TEMP/pgclear-pgbouncer")
          printf 'binary=%s\n' "$pgclear_proxy_binary" >> "$GITHUB_OUTPUT"
      - run: npm run test:compat
        env:
          PGCLEAR_PGBOUNCER: ${{ steps.pgbouncer.outputs.binary }}
          PGCLEAR_POSTGRES_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin
