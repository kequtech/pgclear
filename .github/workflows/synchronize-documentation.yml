name: Synchronize documentation

on:
  push:
    branches:
      - 'main'
    paths:
      - '**/docs/**'

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize documentation with Kequtech
        uses: kequtech/kequtech-monorepo/agent-helpers/github-action-docs@main
        with:
          ingest-token: ${{ secrets.SITE_EDITORIAL_INGEST_TOKEN }}
